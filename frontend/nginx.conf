server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  # La API y los archivos demo se redirigen al contenedor del backend
  location /api/ { proxy_pass http://backend:8080; }
  location /demo/ { proxy_pass http://backend:8080; }

  # React Router: cualquier otra ruta devuelve index.html
  location / { try_files $uri /index.html; }
}
