# =====================================================================
# Blueprint de Render: DroneMission Pro (frontend + backend en un servicio)
#
# Base de datos: Render permite UNA sola PostgreSQL gratuita por cuenta, así
# que no se crea aquí. Sin DB_HOST se usa H2 interna (se reinicia al dormir).
# Para guardar las cuentas de forma permanente escribe en el panel los datos
# de tu PostgreSQL (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD). Las
# tablas se crean en el esquema "dronemission", así que puede ser una base
# que ya uses para otra cosa.
#
# Las variables ADMIN_* son SECRETAS (sync: false): Render las pide en su
# panel y NUNCA quedan guardadas en GitHub.
# =====================================================================
services:
  - type: web
    name: dronemission-pro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # El Dockerfile elige postgres automáticamente si DB_HOST tiene valor
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TZ
        value: America/Bogota
      # Seguridad para un servidor público
      - key: APP_DEMO_USERS
        value: "false"
      - key: APP_SHOW_RESET_TOKEN
        value: "false"
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: APP_REGISTRATION_ENABLED
        value: "true"
      # Administrador propietario (secretos: se escriben en el panel de Render)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_FIRST_NAME
        sync: false
      - key: ADMIN_LAST_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
