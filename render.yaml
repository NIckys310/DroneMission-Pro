# =====================================================================
# Blueprint de Render: DroneMission Pro (frontend + backend en un servicio)
#
# Base de datos: MongoDB. Crea una base gratuita en MongoDB Atlas y escribe
# su cadena de conexión en el panel de Render como MONGODB_URI (secreta).
# Sin MONGODB_URI se usa un MongoDB embebido dentro del servidor (los datos
# vuelven al estado inicial cuando el servicio se duerme).
#
# Las variables ADMIN_* son SECRETAS (sync: false): Render las pide en su
# panel y NUNCA quedan guardadas en GitHub.
# =====================================================================
services:
  - type: web
    name: dronemission-pro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # El Dockerfile usa el perfil "mongo" si MONGODB_URI tiene valor; si no, "embedded"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TZ
        value: America/Bogota
      # Seguridad para un servidor público
      - key: APP_DEMO_USERS
        value: "false"
      - key: APP_SHOW_RESET_TOKEN
        value: "false"
      - key: APP_REGISTRATION_ENABLED
        value: "true"
      # Administrador propietario (secretos: se escriben en el panel de Render)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_FIRST_NAME
        sync: false
      - key: ADMIN_LAST_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
