# =====================================================================
# DroneMission Pro - Configuración del backend
# Los valores sensibles se leen de variables de entorno (ver .env.example).
# Perfil por defecto: "h2" (base de datos en archivo, no requiere instalar nada).
# Para PostgreSQL: SPRING_PROFILES_ACTIVE=postgres
# =====================================================================
spring:
  application:
    name: dronemission-pro
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    open-in-view: false
    hibernate:
      # "validate": Hibernate comprueba al arrancar que las entidades coinciden con las tablas
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  # PORT lo define la plataforma en la nube (Render); en local se usa 8080
  port: ${PORT:${SERVER_PORT:8080}}
  # Respeta X-Forwarded-Proto/Host cuando corre detrás del proxy HTTPS de la nube
  forward-headers-strategy: framework
  error:
    include-message: always

app:
  jwt:
    # Solo para desarrollo. En producción define JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:clave-de-desarrollo-dronemission-pro-cambiar-en-produccion-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  storage:
    path: ${STORAGE_PATH:./uploads}
  security:
    # Usuarios demo (contraseña pública Demo2026!). En la nube: false
    demo-users: ${APP_DEMO_USERS:true}
    registration-enabled: ${APP_REGISTRATION_ENABLED:true}
    # Muestra el token de recuperación en pantalla (simulación). En la nube: false
    show-reset-token: ${APP_SHOW_RESET_TOKEN:true}
    max-failed-attempts: ${APP_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${APP_LOCK_MINUTES:15}
    auth-requests-per-minute: ${APP_AUTH_REQUESTS_PER_MINUTE:20}
    # Administrador propietario: se crea al arrancar si se definen estas variables (secretas)
    admin:
      email: ${ADMIN_EMAIL:}
      username: ${ADMIN_USERNAME:}
      first-name: ${ADMIN_FIRST_NAME:}
      last-name: ${ADMIN_LAST_NAME:}
      password: ${ADMIN_PASSWORD:}
      reset-password: ${ADMIN_RESET_PASSWORD:false}
  simulation:
    # Cada cuántos milisegundos el drone virtual envía una lectura
    tick-ms: ${SIMULATION_TICK_MS:2000}
    # Aceleración del tiempo simulado (3 = cada segundo real equivale a 3 s de vuelo)
    time-factor: ${SIMULATION_TIME_FACTOR:3}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.dronemission: INFO

---
# Perfil H2: base de datos embebida guardada en ./data (cero instalación)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:${H2_PATH:./data/dronemission};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      # Nunca habilitar en un servidor público
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

---
# Perfil PostgreSQL
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dronemission}
    username: ${DB_USER:dronemission}
    password: ${DB_PASSWORD:dronemission}
