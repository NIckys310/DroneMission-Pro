# OPCIONAL: levanta PostgreSQL + backend + frontend con un solo comando:
#   docker compose up --build
# Luego abre http://localhost:3000  (el proyecto también funciona sin Docker; ver README)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dronemission
      POSTGRES_USER: dronemission
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dronemission}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dronemission"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-dronemission}
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-dronemission-pro-cambiar-en-produccion-2026}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_PATH: /data/uploads
    ports: ["8080:8080"]
    volumes: [uploads:/data/uploads]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  db-data:
  uploads:
