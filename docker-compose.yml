# OPCIONAL: levanta MongoDB + backend + frontend con un solo comando:
#   docker compose up --build
# Luego abre http://localhost:3000  (el proyecto también funciona sin Docker; ver README)
services:
  db:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [db-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      # Perfil "mongo": se conecta al contenedor db en lugar de usar el MongoDB embebido
      SPRING_PROFILES_ACTIVE: mongo
      MONGODB_URI: mongodb://db:27017/dronemission
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-dronemission-pro-cambiar-en-produccion-2026}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_PATH: /data/uploads
    ports: ["8080:8080"]
    volumes: [uploads:/data/uploads]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  db-data:
  uploads:
